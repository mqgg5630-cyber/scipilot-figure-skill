[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scipilot-figure-skill"
version = "2.2.0"
description = "Scientific visualization advisor, Antigravity Skill, and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.12,<2",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "plotly>=5.18",
  "Pillow>=10.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
enhanced = [
  "SciencePlots>=2.1",
  "pypdf>=4.0",
  "kaleido>=0.2.1",
  "PyMuPDF>=1.23",
]
test = ["pytest>=8"]

[project.scripts]
scipilot-figure-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
packages = ["scripts"]

[tool.setuptools.data-files]
"share/scipilot-figure-skill/references" = ["references/*.md"]
