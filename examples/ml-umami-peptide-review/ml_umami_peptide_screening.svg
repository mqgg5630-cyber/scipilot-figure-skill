<text x="92" y="478" font-family="Noto Sans SC Thin" font-size="22" font-weight="700" fill="#B84A4A" text-anchor="start" >关键质量控制</text>
<text x="255" y="475" font-family="Noto Sans SC Thin" font-size="19" font-weight="400" fill="#17324D" text-anchor="start"><tspan x="255" dy="0">① 按序列同源性划分数据，避免近重复肽跨集合造成性能虚高；</tspan><tspan x="255" dy="28">② 报告 MCC / AUROC / AUPRC 与外部测试，不只报告准确率；③ 对接分数不能直接代表鲜味阈值。</tspan></text>
